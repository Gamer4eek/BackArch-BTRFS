[package]
name = "backarch"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Gamer4eek <gamer4eek1@gmail.com>"]
description = "CLI tool for managing BTRFS snapshots"

[dependencies]

[profile.release]
opt-level = 3
lto = true
debug = false
strip = true
overflow-checks = false
debug-assertions = false
codegen-units = 1
panic = "abort"
